name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    name: extension / pg${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17]
    steps:
      - uses: actions/checkout@v4

      - name: Install Postgres ${{ matrix.pg }}
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }} postgresql-${{ matrix.pg }}-pgvector
          echo "/usr/lib/postgresql/${{ matrix.pg }}/bin" >> "$GITHUB_PATH"

      - name: Start Postgres
        run: |
          sudo pg_createcluster ${{ matrix.pg }} main --port 5432 --start || sudo pg_ctlcluster ${{ matrix.pg }} main start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"

      - name: Build and install extension
        working-directory: extension
        run: make && sudo env PATH="$PATH" make install

      - name: Run regression tests
        working-directory: extension
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
        run: make installcheck

      - name: Show regression diffs on failure
        if: failure()
        run: cat test/regress/regression.diffs || true

  go:
    name: go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
